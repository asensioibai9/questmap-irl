# Definición del proyecto Xcode para XcodeGen (https://github.com/yonaskolb/XcodeGen).
# En un Mac: `brew install xcodegen && xcodegen generate` → crea QuestMapIRL.xcodeproj.
name: QuestMapIRL
options:
  bundleIdPrefix: com.questmapirl
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  xcodeVersion: "15.0"
  createIntermediateGroups: true

# MapLibre Native (renderizado de mapas vectoriales). Versión FIJADA a la 7.0.0 estable: la rama
# main del repositorio de distribución apunta a prerelease.
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
  # Spotify iOS SDK (App Remote), oficial. Versión fijada.
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"          # iPhone; iPad como mejora posterior

targets:
  QuestMapIRL:
    type: application
    platform: iOS
    sources:
      - path: QuestMapIRL
        excludes:
          - "Tests/**"
          - "**/*.md"
          - "Resources/Info.plist"
          - "Resources/QuestMapIRL-CarPlay.entitlements"
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: SpotifyiOS
        product: SpotifyiOS
    entitlements:
      path: QuestMapIRL/Resources/QuestMapIRL.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.questmapirl.app
        # Client ID de Spotify (identificador público de la app en Spotify for Developers; NO es el client secret, que no
        # se usa). Si existe la variable de repositorio SPOTIFY_CLIENT_ID en GitHub Actions, el IPA usa esa en su lugar.
        SPOTIFY_CLIENT_ID: "2f82be4c14494a1a9f56ccf56a11cb20"
        # IMPORTANTE: usamos nuestro propio Info.plist (permisos, modos de fondo,
        # launch screen). No usar la clave `info:` de XcodeGen, que lo regeneraría vacío.
        INFOPLIST_FILE: QuestMapIRL/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Rellenar con tu Team ID de Apple Developer para ejecutar en dispositivo real.
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconLight AppIconMono"
    scheme:
      testTargets:
        - QuestMapIRLTests

  QuestMapIRLTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuestMapIRL/Tests
    dependencies:
      - target: QuestMapIRL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.questmapirl.app.tests
        GENERATE_INFOPLIST_FILE: YES
