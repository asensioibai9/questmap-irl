<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista previa de estilos (MapLibre GL JS)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; width: 100%; background: #111; }
  /* Modo minimapa: recorte real del contenido en círculo, como en la app */
  body.minimap #map { width: 240px; height: 240px; border-radius: 50%; border: 4px solid #07090d; margin: 40px; box-sizing: border-box; overflow: hidden; }
  .maplibregl-ctrl-top-left, .maplibregl-ctrl-top-right { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* Herramienta de desarrollo: renderiza el MISMO JSON de estilo que usa la app, sin interfaz.
   Parámetros: ?style=ciudad-nocturna|minimalista-pro|isla|bloques &lat= &lon= &z= &bearing= &pitch= &route=1 &minimap=1
   Es MapLibre GL JS (web); la app usa MapLibre Native. Pueden existir diferencias menores de render. */
const q = new URLSearchParams(location.search);
const num = (k, d) => q.has(k) ? parseFloat(q.get(k)) : d;
const styleName = q.get('style') || 'ciudad-nocturna';
if (q.get('minimap')) document.body.classList.add('minimap');

fetch(q.get('url') || `../../QuestMapIRL/Resources/style-${styleName}.json`)
  .then(r => r.text())
  .then(txt => {
    txt = txt.replace('{{TILES_URL}}', 'https://tiles.openfreemap.org/planet')
             .replace('{{GLYPHS_URL}}', 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf');
    const style = JSON.parse(txt);
    const map = new maplibregl.Map({
      container: 'map', style,
      center: [num('lon', -3.7038), num('lat', 40.4168)], zoom: num('z', 15),
      bearing: num('bearing', 0), pitch: num('pitch', 0),
      attributionControl: false, fadeDuration: 0
    });
    window.map = map;
    // Texturas del estilo (fill-pattern): se cargan bajo demanda desde el catálogo de recursos de la app.
    const wanted = (style.metadata && style.metadata['questmap:images']) || [];
    // Iconos propios del estilo GTA (la app los registra desde el catálogo de recursos con @3x).
    const GTA = {'poi-fuel':'fuel','poi-parking':'parking','poi-health':'hospital','poi-police':'police','poi-food':'food',
      'poi-cafe':'cafe','poi-bar':'bar','poi-grocery':'shop','poi-shop':'shop','poi-culture':'bank','poi-bank':'bank',
      'poi-lodging':'lodging','poi-transit':'transit','poi-destination':'destination','poi-home':'home','poi-work':'work',
      'selection-arrows':'selection-arrows','poi-bike':'bike','poi-bus-stop':'bus-stop','poi-traffic-signal':'signal'};
    // Familia de iconos: GTA V (gta-poi) o GTA VI (gta6-poi, estilo costa-tropical).
    const family = styleName === 'costa-tropical' ? 'gta6-poi' : (styleName === 'ciudad-nocturna' || q.get('icons') === 'gta') ? 'gta-poi' : null;
    map.on('styleimagemissing', async e => {
      if (e.id === 'user-arrow') {
        // Misma forma que MapAvatar.arrow (con disco oscuro en GTA VI), dibujada en un canvas.
        const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d'); g.scale(2, 2);
        if (styleName === 'costa-tropical') {
          g.beginPath(); g.arc(24, 24, 20, 0, Math.PI * 2); g.fillStyle = '#16181d'; g.fill();
          g.lineWidth = 2.5; g.strokeStyle = 'rgba(255,255,255,0.9)'; g.stroke();
          g.beginPath(); g.moveTo(24, 12); g.lineTo(33, 34); g.lineTo(24, 29); g.lineTo(15, 34); g.closePath();
          g.fillStyle = '#fff'; g.fill();
        } else {
          g.beginPath(); g.moveTo(24, 5); g.lineTo(39, 41); g.lineTo(24, 32); g.lineTo(9, 41); g.closePath();
          g.lineWidth = 3; g.strokeStyle = '#0a0b0d'; g.stroke(); g.fillStyle = '#fff'; g.fill();
        }
        if (!map.hasImage(e.id)) map.addImage(e.id, g.getImageData(0, 0, 96, 96), {pixelRatio: 2});
        return;
      }
      // GTA VI tiene además iconos propios `poi-<recurso>` sin equivalente en GTA V.
      const viExtra = family === 'gta6-poi' && e.id.startsWith('poi-') && !GTA[e.id];
      if ((GTA[e.id] || viExtra) && family) {
        const n = GTA[e.id] || e.id.slice(4);
        const res = await map.loadImage(`../../QuestMapIRL/Resources/Assets.xcassets/${family}-${n}.imageset/${family}-${n}.png`);
        if (!map.hasImage(e.id)) map.addImage(e.id, res.data, {pixelRatio: 3});
        return;
      }
      if (!wanted.includes(e.id)) return;
      const res = await map.loadImage(`../../QuestMapIRL/Resources/Assets.xcassets/${e.id}.imageset/${e.id}.png`);
      if (!map.hasImage(e.id)) map.addImage(e.id, res.data);
    });
    map.on('load', () => {
      if (q.get('route')) {
        // Ruta real de OSRM (Puerta del Sol → Plaza de Castilla) para ver la capa de ruta y el destino
        fetch('https://router.project-osrm.org/route/v1/driving/-3.7038,40.4168;-3.6883,40.4530?overview=full&geometries=geojson')
          .then(r => r.json()).then(d => {
            const g = d.routes[0].geometry;
            map.getSource('route').setData({type: 'Feature', geometry: g, properties: {}});
            map.getSource('destination').setData({type: 'Feature', geometry: {type: 'Point', coordinates: g.coordinates.at(-1)}, properties: {}});
          }).catch(() => {});
      }
      if (q.get('select') && map.getSource('selection')) {
        const [sl, so] = q.get('select').split(',').map(parseFloat);
        map.getSource('selection').setData({type: 'Feature', geometry: {type: 'Point', coordinates: [so, sl]}, properties: {}});
      }
      map.getSource('user').setData({type: 'Feature', geometry: {type: 'Point', coordinates: [num('lon', -3.7038), num('lat', 40.4168)]}, properties: {heading: num('bearing', 0)}});
    });
    map.on('idle', () => { document.title = 'idle'; });
    map.on('error', e => console.log('maplibre error', e && e.error && e.error.message));
  });
</script>
</body>
</html>
