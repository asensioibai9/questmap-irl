# Compila y ejecuta los tests en un Mac de GitHub Actions.
# Útil si no tienes Mac: los errores de compilación aparecen en la pestaña Actions del repositorio.
name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project QuestMapIRL.xcodeproj \
            -scheme QuestMapIRL \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project QuestMapIRL.xcodeproj \
            -scheme QuestMapIRL \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
