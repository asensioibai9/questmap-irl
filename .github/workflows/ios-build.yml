# Compila y ejecuta los tests en un Mac de GitHub Actions.
# Útil si no tienes Mac: los errores de compilación aparecen en la pestaña Actions del repositorio.
name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project QuestMapIRL.xcodeproj \
            -scheme QuestMapIRL \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project QuestMapIRL.xcodeproj \
            -scheme QuestMapIRL \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO | tee test.log

      # Resumen visible en la página de la ejecución: pasados, saltados y fallidos.
      - name: Resumen de tests
        if: always()
        run: |
          {
            echo "### Resultado de los tests"
            echo '```'
            grep -E "Executed [0-9]+ tests?, with" test.log | tail -n 1 || true
            echo "--- Saltados ---"
            grep -E "Test Case .* skipped" test.log || echo "(ninguno)"
            echo "--- Fallidos ---"
            grep -E "Test Case .* failed" test.log || echo "(ninguno)"
            echo "--- Tests de voz ---"
            grep -E "Test Case .*NavigationVoice.* (passed|skipped|failed)" test.log || echo "(no aparecen)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
