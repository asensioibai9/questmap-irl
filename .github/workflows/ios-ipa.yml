# Genera un .ipa SIN FIRMAR para instalarlo en un iPhone con una herramienta
# de sideloading (Sideloadly o AltStore) usando tu propio Apple ID.
# Descarga: pestaña Actions > esta ejecución > "Artifacts" > QuestMapIRL-unsigned-ipa.
name: iOS IPA (sin firmar)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for device (unsigned)
        env:
          # Solo sustituye al Client ID de project.yml si existe la variable de repositorio SPOTIFY_CLIENT_ID.
          SPOTIFY_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          xcodebuild build \
            -project QuestMapIRL.xcodeproj \
            -scheme QuestMapIRL \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ${SPOTIFY_ID:+SPOTIFY_CLIENT_ID="$SPOTIFY_ID"}

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP" || { echo "No se encontró la .app"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr QuestMapIRL-unsigned.ipa Payload
          ls -la QuestMapIRL-unsigned.ipa
          echo "--- Frameworks embebidos en la app ---"
          ls -la Payload/*.app/Frameworks || echo "SIN CARPETA Frameworks (MapLibre no está embebido)"
          echo "--- Estilos de mapa en el bundle ---"
          ls -la Payload/*.app/*.json

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: QuestMapIRL-unsigned-ipa
          path: QuestMapIRL-unsigned.ipa
          retention-days: 14
