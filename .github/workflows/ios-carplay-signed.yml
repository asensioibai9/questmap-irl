# Build FIRMADA con el permiso de CarPlay (com.apple.developer.carplay-maps). Solo se ejecuta a mano (workflow_dispatch).
#
# Requisitos previos (NO resolubles desde el repositorio):
#   1. Apple ha concedido el permiso CarPlay Navigation a tu cuenta de desarrollador.
#   2. El App ID de la app tiene activada esa capacidad.
#   3. Hay un perfil de aprovisionamiento MANUAL generado DESPUÉS de activarla (Apple: con firma automática iOS no instala
#      la app en CarPlay).
#
# SEGURIDAD — qué contiene cada secreto (Settings › Secrets and variables › Actions):
#   IOS_DIST_CERT_P12_BASE64  certificado de firma Y SU CLAVE PRIVADA (.p12) en base64. Al guardarlo aquí, la clave privada
#                             SALE de tu PC: GitHub la guarda cifrada y la descifra en un Mac temporal de GitHub en cada
#                             ejecución. Quien pueda modificar los workflows de este repositorio podría usarla. Si se
#                             filtra, revoca el certificado en Apple Developer.
#   IOS_DIST_CERT_PASSWORD    contraseña de ese .p12.
#   IOS_PROFILE_BASE64        perfil .mobileprovision: App ID, Team ID, permisos y, si es de desarrollo, UDID de tus
#                             dispositivos. No es una clave, pero contiene datos de tu cuenta: no se publica.
#   IOS_TEAM_ID               identificador de tu equipo de Apple Developer.
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64  (opcional, TestFlight) clave de API de App Store Connect; la .p8 es
#                             privada y da acceso a tu cuenta de App Store Connect según el rol con que la crees.
#
# Medidas de este workflow:
#   - Mac de GitHub (macos-15-intel): imprescindible para xcodebuild y codesign; la máquina se destruye al terminar.
#   - Llavero TEMPORAL con contraseña aleatoria; certificado, perfil y clave .p8 se borran SIEMPRE al final (también si falla).
#   - No imprime secretos, ni el contenido del perfil, ni Team ID / App ID: solo comprobaciones sí/no.
#   - El repositorio es público y sus registros también: por eso los mensajes son mínimos.
#   - El IPA firmado NO se publica como artefacto salvo que lo pidas (incluye el perfil embebido). Subir a TestFlight
#     también es opcional y está desactivado por defecto.
name: iOS CarPlay (firmada)

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Método de exportación: app-store (TestFlight) o development (dispositivos registrados)"
        required: true
        default: app-store
        type: choice
        options: [app-store, development]
      upload_testflight:
        description: "Subir a TestFlight al terminar (requiere los secretos ASC_*)"
        required: true
        default: false
        type: boolean
      upload_artifact:
        description: "Guardar el IPA firmado como artefacto (repo público: lleva tu perfil embebido)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  signed:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.questmapirl.app
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existen los secretos de firma
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -n "$PROFILE" ] || missing="$missing IOS_PROFILE_BASE64"
          [ -n "$TEAM" ] || missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos:$missing. Sin el permiso de Apple y un perfil manual con CarPlay no se puede firmar una build para CarPlay (ver docs/21-carplay.md)."
            exit 1
          fi

      - name: Instalar certificado y perfil (llavero temporal)
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/perfil.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" > "$RUNNER_TEMP/perfil.plist" 2>/dev/null
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/perfil.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/perfil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "::add-mask::$UUID"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "Certificado y perfil instalados en un llavero temporal."

      - name: Comprobar que el PERFIL autoriza CarPlay y corresponde a la app
        run: |
          P="$RUNNER_TEMP/perfil.plist"
          if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.carplay-maps" "$P" > /dev/null 2>&1; then
            echo "::error::El perfil NO incluye com.apple.developer.carplay-maps: Apple aún no ha concedido el permiso, o el perfil se generó antes de activarlo en el App ID."
            exit 1
          fi
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$P")
          case "$APP_ID" in
            *".$BUNDLE_ID") echo "Perfil: incluye CarPlay Navigation y corresponde a $BUNDLE_ID." ;;
            *) echo "::error::El perfil no corresponde a $BUNDLE_ID."; exit 1 ;;
          esac

      - name: Instalar XcodeGen y generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archivar con firma manual y el entitlement de CarPlay
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          SPOTIFY_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          xcodebuild archive \
            -project QuestMapIRL.xcodeproj \
            -scheme QuestMapIRL \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuestMapIRL.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_ENTITLEMENTS=QuestMapIRL/Resources/QuestMapIRL-CarPlay.entitlements \
            ${SPOTIFY_ID:+SPOTIFY_CLIENT_ID="$SPOTIFY_ID"}

      - name: Exportar IPA
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          METHOD: ${{ inputs.export_method }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/QuestMapIRL.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" > /dev/null
          echo "IPA exportado."

      - name: Verificar la app YA FIRMADA (permiso de CarPlay y escena)
        run: |
          cd "$RUNNER_TEMP" && rm -rf check && mkdir check && cd check
          unzip -q "$RUNNER_TEMP"/export/*.ipa
          APP=$(ls -d Payload/*.app)
          codesign -d --entitlements :- "$APP" > ent.plist 2>/dev/null
          echo "Claves de entitlements firmadas (solo nombres):"
          plutil -convert json -o - ent.plist | python3 -c "import json,sys; [print(' -', k) for k in sorted(json.load(sys.stdin))]"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.carplay-maps" ent.plist > /dev/null \
            || { echo "::error::La app firmada NO lleva com.apple.developer.carplay-maps"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication" "$APP/Info.plist" > /dev/null \
            || { echo "::error::Falta la escena de CarPlay en el Info.plist"; exit 1; }
          echo "OK: firmada con com.apple.developer.carplay-maps y con la escena de CarPlay declarada."
          cd .. && rm -rf check

      - name: Guardar el IPA firmado (opcional)
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: QuestMapIRL-carplay-${{ inputs.export_method }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 3

      - name: Subir a TestFlight (opcional)
        if: ${{ inputs.upload_testflight && inputs.export_method == 'app-store' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY" ] \
            || { echo "::error::Faltan los secretos ASC_KEY_ID, ASC_ISSUER_ID o ASC_KEY_P8_BASE64."; exit 1; }
          umask 077
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Borrar llavero, certificado, perfil y claves (siempre)
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/firma.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/perfil.mobileprovision" "$RUNNER_TEMP/perfil.plist" "$RUNNER_TEMP/export.plist"
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/export" "$RUNNER_TEMP/QuestMapIRL.xcarchive" "$RUNNER_TEMP/check"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          echo "Materiales de firma borrados."
