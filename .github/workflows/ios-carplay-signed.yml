# Build FIRMADA con el permiso de CarPlay (com.apple.developer.carplay-maps).
#
# Solo sirve cuando Apple ya ha concedido el permiso de navegación de CarPlay a tu cuenta de pago, lo has añadido al App ID
# y has generado un perfil de aprovisionamiento MANUAL que lo incluye. Apple: con firma automática iOS no instala la app
# en CarPlay. Sideloadly firma con un perfil propio que no incluye CarPlay, así que esta build no se instala con Sideloadly.
#
# Secretos del repositorio (Settings › Secrets and variables › Actions). Los subes tú; nunca se escriben en el repo ni
# en los logs:
#   IOS_DIST_CERT_P12_BASE64   certificado de firma (.p12) en base64
#   IOS_DIST_CERT_PASSWORD     contraseña de ese .p12
#   IOS_PROFILE_BASE64         perfil .mobileprovision (con CarPlay Navigation) en base64
#   IOS_TEAM_ID                tu Team ID
# Opcional, para subir a TestFlight (instalación sin Mac):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64  clave de API de App Store Connect
name: iOS CarPlay (firmada)

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Método de exportación: app-store (TestFlight) o development (dispositivos registrados)"
        required: true
        default: app-store
        type: choice
        options: [app-store, development]
      upload_testflight:
        description: "Subir a TestFlight al terminar (requiere los secretos ASC_*)"
        required: true
        default: false
        type: boolean

jobs:
  signed:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.questmapirl.app
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existen los secretos de firma
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -n "$PROFILE" ] || missing="$missing IOS_PROFILE_BASE64"
          [ -n "$TEAM" ] || missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos:$missing. Sin el permiso de Apple y un perfil manual con CarPlay no se puede firmar una build para CarPlay (ver docs/21-carplay.md)."
            exit 1
          fi

      - name: Instalar certificado y perfil (llavero temporal)
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/perfil.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" > "$RUNNER_TEMP/perfil.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/perfil.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/perfil.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/perfil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Comprobar que el PERFIL autoriza CarPlay y corresponde a la app
        run: |
          P="$RUNNER_TEMP/perfil.plist"
          if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.carplay-maps" "$P" > /dev/null 2>&1; then
            echo "::error::El perfil «$PROFILE_NAME» NO incluye com.apple.developer.carplay-maps. Apple aún no ha concedido el permiso, o no lo has activado en el App ID antes de generar el perfil."
            exit 1
          fi
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$P")
          echo "Perfil: $PROFILE_NAME · App ID: $APP_ID"
          case "$APP_ID" in
            *".$BUNDLE_ID") ;;
            *) echo "::error::El perfil es para $APP_ID, no para $BUNDLE_ID."; exit 1 ;;
          esac

      - name: Instalar XcodeGen y generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archivar con firma manual y el entitlement de CarPlay
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          SPOTIFY_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          xcodebuild archive \
            -project QuestMapIRL.xcodeproj \
            -scheme QuestMapIRL \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/QuestMapIRL.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_ENTITLEMENTS=QuestMapIRL/Resources/QuestMapIRL-CarPlay.entitlements \
            ${SPOTIFY_ID:+SPOTIFY_CLIENT_ID="$SPOTIFY_ID"}

      - name: Exportar IPA
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          METHOD: ${{ inputs.export_method }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/QuestMapIRL.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Verificar entitlements de la app YA FIRMADA y su escena de CarPlay
        run: |
          cd "$RUNNER_TEMP" && rm -rf check && mkdir check && cd check
          unzip -q "$RUNNER_TEMP"/export/*.ipa
          APP=$(ls -d Payload/*.app)
          codesign -d --entitlements :- "$APP" > ent.plist
          echo "--- Entitlements firmados ---"; cat ent.plist
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.carplay-maps" ent.plist \
            || { echo "::error::La app firmada NO lleva com.apple.developer.carplay-maps"; exit 1; }
          echo "--- Escena de CarPlay en el Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication" "$APP/Info.plist" \
            || { echo "::error::Falta la escena de CarPlay en el Info.plist"; exit 1; }
          echo "OK: firmada con el permiso de CarPlay y la escena declarada."

      - name: Subir el IPA firmado
        uses: actions/upload-artifact@v4
        with:
          name: QuestMapIRL-carplay-${{ inputs.export_method }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Subir a TestFlight (opcional)
        if: ${{ inputs.upload_testflight && inputs.export_method == 'app-store' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY" ] \
            || { echo "::error::Faltan los secretos ASC_KEY_ID, ASC_ISSUER_ID o ASC_KEY_P8_BASE64."; exit 1; }
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Borrar el llavero temporal
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/firma.keychain-db" || true
